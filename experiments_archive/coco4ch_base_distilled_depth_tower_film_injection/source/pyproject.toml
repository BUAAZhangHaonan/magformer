[tool.black]
line-length = 100
target-version = ["py310"]
# Keep third-party baseline repos and runtime outputs out of formatting.
extend-exclude = '''
(
  ^/baselines/|
  ^/output/|
  ^/\.git/|
  ^/\.pytest_cache/|
  ^/build/|
  ^/dist/
)
'''

[tool.isort]
profile = "black"
line_length = 100
# Exclude vendored baseline repos and runtime outputs.
skip = ["baselines", "output"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Keep analysis focused on our code; avoid vendored baselines and outputs.
extend-exclude = ["baselines", "output", ".git", ".pytest_cache"]

[tool.ruff.lint]
# Start with a small, low-noise ruleset; expand gradually as we refactor.
select = ["F"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
