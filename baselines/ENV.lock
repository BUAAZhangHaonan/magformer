## Known Issues / Workarounds

### 1) `Polygon3` / `import Polygon` crash

`Polygon3==3.0.9.1` was tested and caused a hard crash (`free(): invalid pointer`) on Python 3.10.

We intentionally do **not** install it:

```bash
conda run -n magformer python -m pip uninstall -y Polygon3
```

This does not affect the ECC instance segmentation baselines we run (it is only used by optional text-eval code).


### 2) `MultiScaleDeformableAttention` import requires `import torch` first

On this machine, running `python -c "import MultiScaleDeformableAttention"` may fail with:
`ImportError: libc10.so: cannot open shared object file`.

Workaround (OK for all training scripts):

```bash
conda run -n magformer python -c "import torch; import MultiScaleDeformableAttention; print('ok')"
```


## Build Notes

### UOAIS (AdelaiDet) compiled ops (`adet._C`)

The vendored UOAIS codebase contains a legacy CUDA/C++ extension (`adet._C`) that fails to
compile on modern PyTorch (e.g. missing `THC/THC.h`).

For ECC baselines we do **not** require these ops. We patched `adet.layers` / `adet.modeling`
to make the compiled ops optional, so that `import adet.modeling` works without building
`adet._C`.

Verification:

```bash
conda run -n magformer python -c "import sys; sys.path.insert(0,'baselines/icra_2026/uoais'); import adet; import adet.modeling; print('uoais modeling ok')"
```

- We avoid compiling multiple versions of MultiScaleDeformableAttention. Prefer reusing the one already working for
  `baselines/Mask2Former` (official) and our Detectron2 stack.
