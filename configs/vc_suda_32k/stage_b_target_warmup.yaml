name: vc_suda_32k_stage_b_target_warmup

data:
  dataset_root: /home/hdd3/zhanghaonan/magformer/magformer_datasets/vc_suda_32k
  train_ann: annotations/instances_source_train.json
  val_ann: annotations/instances_target_val.json
  image_size: 512
  min_scale: 0.1
  max_scale: 2.0
  depth:
    clip_min: 0.3544
    clip_max: 0.6374
    norm: minmax
    per_sample_norm: true
  depth_noise:
    enabled: false

model:
  meta_architecture: MagFormer
  weights: null
  finetune_weights: /home/hdd3/zhanghaonan/magformer/output/vc_suda_32k/stage_a/model_best.pth
  magformer:
    depth_mode: light
    rgb_backbone:
      name: D2SwinTransformer
      pretrained: false
    swin:
      pretrain_img_size: 1024
      embed_dim: 96
      depths: [2, 2, 6, 2]
      num_heads: [3, 6, 12, 24]
      window_size: 7
      drop_path_rate: 0.2
      out_features: [res2, res3, res4, res5]
    depth_backbone:
      name: mobilenetv3_small
      pretrained: false
      enabled: true
      out_features: [res3]
    modality_fusion:
      enabled: true
      mode: sa_gate
      priors: [edge, valid-hole]
    mask_former:
      hidden_dim: 256
      num_object_queries: 100
      train_num_points: 12544
      dec_layers: 10
    sem_seg_head:
      num_classes: 1
    dpe:
      enabled: false
  pixel_mean: [116.707, 114.1293, 113.4361]
  pixel_std: [27.9589, 28.6797, 28.8131]

solver:
  ims_per_batch: 8
  base_lr: 1.0e-5
  max_iter: 5000
  warmup_iters: 50
  backbone_multiplier: 0.1
  lr_scheduler: poly
  clip_gradients: true
  clip_type: full_model
  clip_value: 1.0
  norm_type: 2.0
  amp_enabled: true

runtime:
  output_dir: /home/hdd3/zhanghaonan/magformer/output/vc_suda_32k/stage_b
  eval_period: 1000
  checkpoint_period: 500
  ddp_enabled: true
  gpus: [0, 1, 2, 3]
  seed: 42
  log_period: 20
  skip_depth_sanity: true
  find_unused_parameters: false

vc_suda:
  stage: B
  ema_teacher:
    enabled: false
  pseudo_label:
    quality_threshold: 0.5
    use_curriculum: true
    max_instances: 100
  domain_adaptation:
    prototype_weight: 0.0
    boundary_weight: 0.0
    modality_dropout_weight: 0.0
  curriculum:
    start_threshold: 0.7
    end_threshold: 0.3
    warmup_epochs: 15
  unsupervised_weight: 0.0
  unsupervised_warmup_epochs: 10
  source_ann: annotations/instances_source_train.json
  target_labeled_ann: annotations/instances_target_labeled.json
  target_unlabeled_ann: null
  target_labeled_root: null
  target_unlabeled_root: null
