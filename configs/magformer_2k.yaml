# MAGFormer 2K Training Configuration
# 优化配置用于快速训练，目标: 2K轮达到AP>50

name: "magformer_2k"

# ── 数据 ──────────────────────────────────────────
data:
  dataset_root: null   # 命令行 --dataset-root 指定
  train_ann: "annotations/instances_train.json"
  val_ann: "annotations/instances_val.json"
  image_size: 512      # 使用512尺寸加速训练
  min_scale: 0.8       # 对齐mask2former LSJ
  max_scale: 1.2
  random_flip: "horizontal"
  size_divisibility: 32
  format: "RGB"
  rgb_photo_aug:
    enabled: false
    brightness: 0.0
    contrast: 0.0
    saturation: 0.0
    hue: 0.0
  depth:
    format: "I"
    scale: 1.0        # 数据已经是米制单位
    shift: 0.0
    clip_min: 0.0
    clip_max: 1.0
    norm: "minmax"
  depth_noise:
    enabled: false
    gaussian_std: 0.0
    speckle_std: 0.0
    drop_prob: 0.0
    drop_val: 0.0
  noise_mask:
    enabled: false
    check_dir: false

# ── 模型 ──────────────────────────────────────────
model:
  meta_architecture: "MagFormer"
  weights: null

  magformer:
    rgb_backbone:
      name: "D2SwinTransformer"
      weights: null
      freeze_at: 0
      pretrained: false

    swin:
      pretrain_img_size: 512
      patch_size: 4
      embed_dim: 96
      depths: [2, 2, 6, 2]      # 标准 tiny 配置
      num_heads: [3, 6, 12, 24]
      window_size: 7
      mlp_ratio: 4.0
      qkv_bias: true
      drop_rate: 0.0
      attn_drop_rate: 0.0
      drop_path_rate: 0.2
      ape: false
      patch_norm: true
      out_features: ["res2", "res3", "res4", "res5"]

    depth_backbone:
      name: "ConvNeXtDepthBackbone"
      weights: null
      freeze_at: 0
      pretrained: false

    convnext:
      depths: [3, 3, 9, 3]      # 标准 tiny 配置
      dims: [96, 192, 384, 768]
      drop_path_rate: 0.0
      layer_scale: 1.0e-6

    modality_fusion:
      enabled: true
      residual_alpha: 0.05
      loss_entropy_w: 0.01
      temp_init: 1.5
      temp_final: 1.0
      temp_steps: 1000
      clamp_min: 0.05
      clamp_max: 0.95
      noise_mask_weight: 0.0
      hidden_dim: 256
      feature_dims: [96, 192, 384, 768]
      scale_keys: ["res2", "res3", "res4", "res5"]
      post_fuse_norm: true
      prior:
        enabled: true
        use_gradient: true
        use_variance: true
        use_valid_hole: true
        use_rgb_edge: false
        var_kernel: 5
        z_min: 0.0
        z_max: 1.0
        compute_on: "res3"
        robust_norm: true
        robust_norm_method: "minmax"

    mask_former:
      transformer_decoder_name: "MultiScaleMaskedTransformerDecoder"
      deep_supervision: true
      no_object_weight: 0.1
      class_weight: 2.0     # 对齐mask2former
      dice_weight: 5.0      # 对齐mask2former
      mask_weight: 5.0      # 对齐mask2former
      nheads: 8
      dropout: 0.1
      dim_feedforward: 1024
      enc_layers: 0
      dec_layers: 6         # 标准层数
      pre_norm: false
      hidden_dim: 256
      num_object_queries: 100  # 增加查询数
      train_num_points: 12544
      oversample_ratio: 3.0
      importance_sample_ratio: 0.75
      object_mask_threshold: 0.0
      overlap_threshold: 0.0

    sem_seg_head:
      name: "MaskFormerHead"
      ignore_value: 255
      num_classes: 1
      loss_weight: 1.0
      convs_dim: 256
      mask_dim: 256
      norm: "GN"
      transformer_enc_layers: 0
      pixel_decoder_name: "MSDeformAttnPixelDecoder"
      in_features: ["res2", "res3", "res4", "res5"]
      common_stride: 4

    pixel_mean: [123.675, 116.280, 103.530]
    pixel_std: [58.395, 57.120, 57.375]

# ── DPE 配置 ──────────────────────────────────────
dpe_enabled: true
dpe_beta: 10.0

# ── 求解器 ────────────────────────────────────────
solver:
  ims_per_batch: 8          # 增大batch size
  base_lr: 1.0e-4           # 提高学习率
  max_iter: 2000            # 2K轮训练
  warmup_factor: 0.01       # 初始LR = 1e-4 * 0.01 = 1e-6
  warmup_iters: 200
  weight_decay: 0.05
  weight_decay_embed: 0.0
  optimizer: "ADAMW"
  backbone_multiplier: 0.1
  lr_scheduler: "poly"
  steps: [1500, 1800]
  gamma: 0.1
  clip_gradients: true
  clip_type: "full_model"
  clip_value: 0.01
  norm_type: 2.0
  amp_enabled: true         # 启用AMP加速

# ── 运行时 ────────────────────────────────────────
runtime:
  device: "cuda"
  gpus: [0]
  num_workers: 4
  output_dir: "output/magformer_2k"
  seed: 42
  eval_period: 200          # 每200轮评估一次
  checkpoint_period: 500    # 每500轮保存一次
  resume: null
  logger:
    type: "tensorboard"
    log_dir: "output/magformer_2k/logs"
    project: "magformer"
    entity: null
    run_name: "2k_train"
  ddp_enabled: false
  find_unused_parameters: false

version: 2.0
