VERSION: 2

# MSMFormer (PretrainedMeanShiftMaskFormer) baseline on ECC 0831_1K (RGBD).
#
# Budget: 5,000 iters @ batch=4 ~= 22.6 epochs (886 train images / 4 ~= 222 iters/epoch)
# Policy: prefer the cached official RGBD checkpoint when available.
#
# Note:
# - This baseline uses the UCN-style backbone inside the MSMFormer repo.
# - The wrapper / experiment runners inject `MODEL.WEIGHTS` from
#   `output/pretrained/norm_RGBD_pretrained.pth` when present.

MODEL:
  META_ARCHITECTURE: "PretrainedMeanShiftMaskFormer"
  WEIGHTS: ""

  # Build a plain ResNet backbone so `backbone.output_shape()` contains `res5`
  # (MSMFormer feeds its UCN feature map under the `res5` key).
  BACKBONE:
    FREEZE_AT: 0
    NAME: "build_resnet_backbone"

  RESNETS:
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    DEPTH: 50

  # MSMFormer extra knobs (see `meanshiftformer/config.py`)
  USE_DEPTH: True
  USE_OTHER_BACKBONE: False

  EMBEDDING:
    USE_LOSS: False

  MASK_FORMER:
    # MSMFormer's transformer decoder expects a list of multi-scale features.
    # Our scratch baseline uses a single feature level (`res5`), so we route the
    # pixel-decoder feature list into the decoder and select the 1-level variant.
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    TRANSFORMER_DECODER_NAME: "PretrainedMeanShiftTransformerDecoder"
    NUM_OBJECT_QUERIES: 100
    USE_MEANSHIFT_CROSS_ATTENTION: True
    USE_MEANSHIFT_SELF_ATTENTION: True
    DISABLE_MEANSHIFT_ATTENTION_MASK: False
    DECODER_BLOCK_NORM: True
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    DROPOUT: 0.0
    DEC_LAYERS: 7
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False
      OBJECT_MASK_THRESHOLD: 0.8
      OVERLAP_THRESHOLD: 0.8
      SEM_SEG_POSTPROCESSING_BEFORE_INFERENCE: False

  SEM_SEG_HEAD:
    NAME: "PretrainedMeanShiftMaskFormerHead"
    NUM_CLASSES: 1
    IGNORE_VALUE: 255
    IN_FEATURES: ["res5"]
    PIXEL_DECODER_NAME: "SimpleBasePixelDecoder"
    # UCN-style backbone outputs a 64-dim embedding map; keep the head dimensions aligned.
    CONVS_DIM: 64
    MASK_DIM: 256
    NORM: "GN"

  # ECC 0831_1K (train RGB) statistics, converted to BGR order for OpenCV readers.
  PIXEL_MEAN: [28.1363, 30.5413, 34.9731]
  PIXEL_STD: [57.2803, 60.9879, 64.8187]

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.0001
  MAX_ITER: 5000
  STEPS: (4000, 4500)
  WARMUP_ITERS: 200
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.1
  CHECKPOINT_PERIOD: 1000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0

DATASETS:
  TRAIN: ("ecc0831_1k_rgbd_train",)
  TEST: ("ecc0831_1k_rgbd_val",)

DATALOADER:
  NUM_WORKERS: 4

INPUT:
  FORMAT: "BGR"
  # MSMFormer meta-arch expects `gt_masks` as a dense tensor during target preparation.
  MASK_FORMAT: "bitmask"
  MIN_SIZE_TRAIN: (512,)
  MAX_SIZE_TRAIN: 512
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 512
  MAX_SIZE_TEST: 512

TEST:
  EVAL_PERIOD: 500

OUTPUT_DIR: "output/experiments/0831_1k_20ep_scratch/msmformer_scratch"
SEED: 42
