# MAGFormer 0831_1K Smoke Configuration (~200 iters)
# Goal: quick end-to-end sanity check (train -> eval) without waiting for 2k/40k iters.

name: "magformer_0831_smoke200"

data:
  dataset_root: null
  train_ann: "annotations/instances_train.json"
  val_ann: "annotations/instances_val.json"
  image_size: 512
  min_scale: 0.8
  max_scale: 1.2
  random_flip: "horizontal"
  size_divisibility: 32
  format: "RGB"
  rgb_photo_aug:
    enabled: false
    brightness: 0.0
    contrast: 0.0
    saturation: 0.0
    hue: 0.0
  depth:
    format: "I"
    scale: 1.0
    shift: 0.0
    clip_min: 0.0
    clip_max: 1.0
    norm: "minmax"
  depth_noise:
    enabled: false
    gaussian_std: 0.0
    speckle_std: 0.0
    drop_prob: 0.0
    drop_val: 0.0
  noise_mask:
    enabled: false
    check_dir: false

model:
  meta_architecture: "MagFormer"
  weights: null

  magformer:
    rgb_backbone:
      name: "D2SwinTransformer"
      weights: null
      freeze_at: 0
      pretrained: true

    swin:
      pretrain_img_size: 512
      embed_dim: 96
      depths: [2, 2, 6, 2]
      num_heads: [3, 6, 12, 24]
      window_size: 7
      drop_path_rate: 0.2
      out_features: ["res2", "res3", "res4", "res5"]

    depth_backbone:
      name: "ConvNeXtDepthBackbone"
      weights: null
      freeze_at: 0
      pretrained: true

    convnext:
      depths: [3, 3, 9, 3]
      dims: [96, 192, 384, 768]
      drop_path_rate: 0.2
      layer_scale: 1.0e-6

    modality_fusion:
      enabled: true
      residual_alpha: 0.05
      loss_entropy_w: 0.01
      temp_init: 1.5
      temp_final: 1.0
      temp_steps: 1000
      clamp_min: 0.05
      clamp_max: 0.95
      noise_mask_weight: 0.0
      hidden_dim: 256
      feature_dims: [96, 192, 384, 768]
      scale_keys: ["res2", "res3", "res4", "res5"]
      post_fuse_norm: true
      prior:
        enabled: true
        use_gradient: true
        use_variance: true
        use_valid_hole: true
        use_rgb_edge: false
        var_kernel: 5
        z_min: 0.0
        z_max: 1.0
        compute_on: "res3"
      robust_norm_enabled: false
      robust_norm_method: "minmax"

    mask_former:
      transformer_decoder_name: "MultiScaleMaskedTransformerDecoder"
      deep_supervision: true
      no_object_weight: 0.1
      class_weight: 2.0
      dice_weight: 5.0
      mask_weight: 5.0
      nheads: 8
      dropout: 0.1
      dim_feedforward: 1024
      enc_layers: 0
      dec_layers: 6
      pre_norm: false
      hidden_dim: 256
      num_object_queries: 100
      train_num_points: 12544
      oversample_ratio: 3.0
      importance_sample_ratio: 0.75
      balanced_ce: false
      balanced_ce_min_fg_ratio: 0.01
      object_mask_threshold: 0.0
      overlap_threshold: 0.0

    sem_seg_head:
      name: "MaskFormerHead"
      ignore_value: 255
      num_classes: 1
      loss_weight: 1.0
      convs_dim: 256
      mask_dim: 256
      norm: "GN"
      transformer_enc_layers: 6
      pixel_decoder_name: "MSDeformAttnPixelDecoder"
      in_features: ["res2", "res3", "res4", "res5"]
      deformable_transformer_encoder_in_features: ["res3", "res4", "res5"]
      common_stride: 4

    pixel_mean: [123.675, 116.280, 103.530]
    pixel_std: [58.395, 57.120, 57.375]

dpe_enabled: true
dpe_beta: 10.0

solver:
  ims_per_batch: 8
  base_lr: 1.0e-4
  max_iter: 200
  warmup_factor: 0.01
  warmup_iters: 50
  weight_decay: 0.05
  weight_decay_embed: 0.0
  optimizer: "ADAMW"
  backbone_multiplier: 0.1
  lr_scheduler: "multistep"
  steps: [30000, 36000]
  gamma: 0.1
  clip_gradients: true
  clip_type: "full_model"
  clip_value: 1.0
  norm_type: 2.0
  amp_enabled: true

runtime:
  device: "cuda"
  gpus: [0]
  num_workers: 4
  output_dir: "magformer/output/magformer_0831_smoke200"
  seed: 42
  log_period: 10
  eval_period: 100
  checkpoint_period: 200
  resume: null
  logger:
    type: "tensorboard"
    log_dir: "magformer/output/magformer_0831_smoke200/logs"
    project: "magformer"
    entity: null
    run_name: "0831_smoke200"
  ddp_enabled: false
  find_unused_parameters: false

version: 2.0
