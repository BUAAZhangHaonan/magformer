name: eval_full_1566_fast_bbox

data:
  dataset_root: /home/hdd3/zhanghaonan/magformer/magformer_datasets/20260318_1K_1566
  train_ann: annotations/instances_all.json
  val_ann: annotations/instances_all.json
  train_split: all
  val_split: all
  image_size: 1024
  min_scale: 0.1
  max_scale: 2.0
  random_flip: horizontal
  size_divisibility: 32
  format: RGB
  rgb_photo_aug:
    enabled: true
    brightness: 0.3
    contrast: 0.3
    saturation: 0.2
    hue: 0.02
  depth:
    format: I
    scale: 1.0
    shift: 0.0
    clip_min: 1.0015300512313843
    clip_max: 2.095623016357422
    norm: minmax
    per_sample_norm: true
  depth_noise:
    enabled: true
    type: gaussian
    gaussian_std: 0.01
  noise_mask:
    enabled: false

model:
  meta_architecture: MagFormer
  weights: null
  finetune_weights: /home/hdd3/zhanghaonan/magformer/output/experiments/20260509_1k_finetune_full_1024_v10/model_best.pth
  magformer:
    depth_mode: light
    rgb_backbone:
      name: D2SwinTransformer
      weights: null
      freeze_at: 0
      pretrained: false
    swin:
      pretrain_img_size: 1024
      embed_dim: 96
      depths: [2, 2, 6, 2]
      num_heads: [3, 6, 12, 24]
      window_size: 7
      drop_path_rate: 0.3
      out_features: [res2, res3, res4, res5]
    depth_backbone:
      name: mobilenetv3_small
      enabled: true
      weights: null
      freeze_at: 0
      pretrained: false
      out_features: [res3]
    modality_fusion:
      enabled: true
      mode: sa_gate
      residual_alpha: 0.05
      loss_entropy_w: 0.05
      temp_init: 2.0
      temp_final: 1.0
      temp_steps: 5000
      clamp_min: 0.05
      clamp_max: 0.95
      noise_mask_weight: 0.0
      hidden_dim: 256
      feature_dims: [96, 192, 384, 768]
      scale_keys: [res2, res3, res4, res5]
      fuse_scales: [res3]
      priors: [edge, valid-hole]
      post_fuse_norm: true
      prior:
        enabled: true
        use_gradient: true
        use_variance: false
        use_valid_hole: true
        use_rgb_edge: false
        var_kernel: 5
        z_min: 0.05
        z_max: 0.95
        compute_on: res3
      robust_norm_enabled: true
      robust_norm_method: minmax
    agpe_enabled: true
    agpe_reduction: 16
    agpe_spatial_kernel: 7
    mask_pilot_enabled: true
    mask_pilot_initial_noise: 1.0
    mask_pilot_final_noise: 0.1
    mask_pilot_start_layer: 1
    mask_former:
      transformer_decoder_name: MultiScaleMaskedTransformerDecoder
      deep_supervision: true
      no_object_weight: 0.1
      class_weight: 2.0
      dice_weight: 5.0
      mask_weight: 5.0
      nheads: 8
      dropout: 0.1
      dim_feedforward: 2048
      enc_layers: 0
      dec_layers: 10
      pre_norm: false
      hidden_dim: 256
      num_object_queries: 100
      train_num_points: 12544
      oversample_ratio: 3.0
      importance_sample_ratio: 0.75
      balanced_ce: true
      balanced_ce_min_fg_ratio: 0.01
      object_mask_threshold: 0.7
      overlap_threshold: 0.5
    sem_seg_head:
      name: MaskFormerHead
      ignore_value: 255
      num_classes: 1
      loss_weight: 1.0
      convs_dim: 256
      mask_dim: 256
      norm: GN
      transformer_enc_layers: 6
      pixel_decoder_name: MSDeformAttnPixelDecoder
      in_features: [res2, res3, res4, res5]
      deformable_transformer_encoder_in_features: [res3, res4, res5]
      common_stride: 4
    dpe:
      enabled: false
  pixel_mean: [116.707, 114.1293, 113.4361]
  pixel_std: [27.9589, 28.6797, 28.8131]

solver:
  ims_per_batch: 4
  base_lr: 2.0e-5
  max_iter: 1
  warmup_factor: 0.001
  warmup_iters: 1
  weight_decay: 0.07
  weight_decay_embed: 0.0
  optimizer: ADAMW
  backbone_multiplier: 0.3
  lr_scheduler: cosine
  clip_gradients: true
  clip_type: full_model
  clip_value: 1.0
  norm_type: 2.0
  amp_enabled: true

runtime:
  device: cuda
  gpus: [0, 1]
  num_workers: 2
  output_dir: /home/hdd3/zhanghaonan/magformer/output/experiments/eval_full_1566_fast_bbox
  seed: 42
  log_period: 20
  eval_period: 1
  checkpoint_period: 99999
  resume: null
  ddp_enabled: true
  find_unused_parameters: true
  skip_depth_sanity: true
  early_stop:
    target_ap: 99.0
    patience: 999
    min_delta: 0.1
  ema_enabled: false
  contrastive_enabled: false
  contrastive_weight: 0.5
  contrastive_temperature: 0.07
  grad_accum_steps: 1
  eval_iou_types: ["bbox"]
  eval_max_images: 300
  eval_batch_size: 4
