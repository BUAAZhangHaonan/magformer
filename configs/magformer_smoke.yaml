# MAGFormer Smoke Test Config — self-contained, tiny model for fast testing
name: "magformer_smoke"

# ── 数据 ──────────────────────────────────────────
data:
  dataset_root: null   # 命令行 --dataset-root 指定
  train_ann: "annotations/instances_train.json"
  val_ann: "annotations/instances_val.json"
  image_size: 512      # 用小尺寸跑快一些
  min_scale: 0.8
  max_scale: 1.2
  random_flip: "none"
  size_divisibility: 32
  format: "RGB"
  rgb_photo_aug:
    enabled: false
    brightness: 0.0
    contrast: 0.0
    saturation: 0.0
    hue: 0.0
  depth:
    format: "I"
    scale: 1.0        # fake data 已经是米制单位
    shift: 0.0
    clip_min: 0.0
    clip_max: 1.0
    norm: "minmax"
  depth_noise:
    enabled: false
    gaussian_std: 0.0
    speckle_std: 0.0
    drop_prob: 0.0
    drop_val: 0.0
  noise_mask:
    enabled: false
    check_dir: false

# ── 模型 ──────────────────────────────────────────
model:
  meta_architecture: "MagFormer"
  weights: null

  magformer:
    rgb_backbone:
      name: "D2SwinTransformer"
      weights: null
      freeze_at: 0
      pretrained: false

    swin:
      pretrain_img_size: 512
      patch_size: 4
      embed_dim: 96
      depths: [2, 2, 2, 2]        # 比 base 更少层
      num_heads: [3, 6, 12, 24]
      window_size: 7
      mlp_ratio: 4.0
      qkv_bias: true
      drop_rate: 0.0
      attn_drop_rate: 0.0
      drop_path_rate: 0.1
      ape: false
      patch_norm: true
      out_features: ["res2", "res3", "res4", "res5"]

    depth_backbone:
      name: "ConvNeXtDepthBackbone"
      weights: null
      freeze_at: 0
      pretrained: false

    convnext:
      depths: [2, 2, 2, 2]        # 比 base 更少层
      dims: [96, 192, 384, 768]
      drop_path_rate: 0.0
      layer_scale: 1.0e-6

    modality_fusion:
      enabled: true
      residual_alpha: 0.05
      loss_entropy_w: 0.01
      temp_init: 1.5
      temp_final: 1.0
      temp_steps: 100
      clamp_min: 0.05
      clamp_max: 0.95
      noise_mask_weight: 0.0
      hidden_dim: 256
      feature_dims: [96, 192, 384, 768]
      scale_keys: ["res2", "res3", "res4", "res5"]
      post_fuse_norm: true
      prior:
        enabled: true
        use_gradient: true
        use_variance: true
        use_valid_hole: true
        use_rgb_edge: false
        var_kernel: 5
        z_min: 0.0
        z_max: 1.0
        compute_on: "res3"

    mask_former:
      deep_supervision: false
      no_object_weight: 0.1
      class_weight: 1.0
      dice_weight: 1.0
      mask_weight: 5.0
      nheads: 8
      dropout: 0.1
      dim_feedforward: 1024
      enc_layers: 0
      dec_layers: 2              # 比 base 少
      pre_norm: false
      hidden_dim: 256
      num_object_queries: 20     # 比 base 少
      train_num_points: 1024
      oversample_ratio: 3.0
      importance_sample_ratio: 0.75
      object_mask_threshold: 0.0
      overlap_threshold: 0.0

    sem_seg_head:
      name: "MaskFormerHead"
      ignore_value: 255
      num_classes: 1
      loss_weight: 1.0
      convs_dim: 256
      mask_dim: 256
      norm: "GN"
      transformer_enc_layers: 0
      pixel_decoder_name: "MSDeformAttnPixelDecoder"
      in_features: ["res2", "res3", "res4", "res5"]
      common_stride: 4

    pixel_mean: [123.675, 116.280, 103.530]
    pixel_std: [58.395, 57.120, 57.375]

# ── 求解器 ────────────────────────────────────────
solver:
  ims_per_batch: 1
  base_lr: 0.0001
  max_iter: 5
  warmup_factor: 1.0
  warmup_iters: 0
  weight_decay: 0.05
  weight_decay_embed: 0.0
  optimizer: "ADAMW"
  backbone_multiplier: 0.1
  lr_scheduler: "poly"
  steps: [4]
  gamma: 0.1
  clip_gradients: true
  clip_type: "full_model"
  clip_value: 0.01
  norm_type: 2.0
  amp_enabled: false

# ── 运行时 ────────────────────────────────────────
runtime:
  device: "cuda"
  gpus: [0]
  num_workers: 0
  output_dir: "output/magformer_smoke"
  seed: 42
  eval_period: 3
  checkpoint_period: 5
  resume: null
  logger:
    type: "tensorboard"
    log_dir: "output/magformer_smoke/logs"
    project: "magformer"
    entity: null
    run_name: null
  ddp_enabled: false
  find_unused_parameters: false

version: 2.0
